name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: tauri-app/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: tauri-app
        run: pnpm install --frozen-lockfile

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Use ad-hoc signing for CI
        working-directory: tauri-app/src-tauri
        run: |
          cat tauri.conf.json | python3 -c "
          import json,sys
          c=json.load(sys.stdin)
          c['bundle']['macOS']['signingIdentity']='-'
          c['bundle']['macOS']['entitlements']=None
          c['bundle']['macOS']['hardenedRuntime']=False
          json.dump(c,sys.stdout,indent=2)
          " > tauri.ci.json
          mv tauri.ci.json tauri.conf.json

      - name: Build ${{ matrix.target }}
        working-directory: tauri-app
        run: pnpm tauri build --target ${{ matrix.target }}

      - name: Rename DMG
        working-directory: tauri-app/src-tauri/target/${{ matrix.target }}/release/bundle/dmg
        run: mv *.dmg Todo_${{ matrix.target }}.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: Todo_${{ matrix.target }}
          path: tauri-app/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/Todo_${{ matrix.target }}.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: tauri-app/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: tauri-app
        run: pnpm install --frozen-lockfile

      - name: Build Windows
        working-directory: tauri-app
        run: pnpm tauri build --target x86_64-pc-windows-msvc

      - name: List bundle output
        run: |
          echo "=== MSI ==="
          dir /s /b tauri-app\src-tauri\target\x86_64-pc-windows-msvc\release\bundle\msi\*.msi
          echo "=== NSIS ==="
          dir /s /b tauri-app\src-tauri\target\x86_64-pc-windows-msvc\release\bundle\nsis\*.exe

      - uses: actions/upload-artifact@v4
        with:
          name: Todo_x86_64-pc-windows-msvc
          path: |
            tauri-app/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            tauri-app/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe

  release:
    needs: [build-macos, build-windows]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Todo_*
          merge-multiple: true
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Build #${{ github.run_number }}
          body: |
            ## 安装说明

            ### macOS
            下载 `Todo_aarch64-apple-darwin.dmg`（Apple 芯片）或 `Todo_x86_64-apple-darwin.dmg`（Intel 芯片）

            由于未使用 Apple 付费证书，首次打开需要：
            1. 双击打开 `.dmg`
            2. 将 `Todo.app` 拖入 **应用程序** 文件夹
            3. **右键点击** `Todo.app` → **打开**
            4. 在弹出的对话框中再次点 **打开**
            5. 以后直接双击即可正常使用

            或者终端运行：

            ```
            xattr -cr /Applications/Todo.app
            ```

            ### Windows
            下载 `.msi` 或 `.exe`，双击安装即可，无需额外操作。
          files: artifacts/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
