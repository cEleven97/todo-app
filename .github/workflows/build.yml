name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: tauri-app/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: tauri-app
        run: pnpm install --frozen-lockfile

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Use ad-hoc signing for CI
        working-directory: tauri-app/src-tauri
        run: |
          cat tauri.conf.json | python3 -c "
          import json,sys
          c=json.load(sys.stdin)
          c['bundle']['macOS']['signingIdentity']='-'
          c['bundle']['macOS']['entitlements']=None
          c['bundle']['macOS']['hardenedRuntime']=False
          json.dump(c,sys.stdout,indent=2)
          " > tauri.ci.json
          mv tauri.ci.json tauri.conf.json

      - name: Build ${{ matrix.target }}
        working-directory: tauri-app
        run: |
          if [ "${{ matrix.target }}" = "aarch64-apple-darwin" ]; then
            pnpm tauri build --target ${{ matrix.target }}
          else
            pnpm tauri build --target ${{ matrix.target }} --bundles app
          fi

      - name: Rename DMG
        if: matrix.target == 'aarch64-apple-darwin'
        working-directory: tauri-app/src-tauri/target/${{ matrix.target }}/release/bundle/dmg
        run: mv *.dmg Todo_${{ matrix.target }}.dmg

      - name: Zip .app
        if: matrix.target == 'x86_64-apple-darwin'
        run: |
          cd tauri-app/src-tauri/target/${{ matrix.target }}/release/bundle/macos
          zip -r Todo_${{ matrix.target }}.zip Todo.app

      - uses: actions/upload-artifact@v4
        if: matrix.target == 'aarch64-apple-darwin'
        with:
          name: Todo_${{ matrix.target }}
          path: tauri-app/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/Todo_${{ matrix.target }}.dmg

      - uses: actions/upload-artifact@v4
        if: matrix.target == 'x86_64-apple-darwin'
        with:
          name: Todo_${{ matrix.target }}
          path: tauri-app/src-tauri/target/${{ matrix.target }}/release/bundle/macos/Todo_${{ matrix.target }}.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: tauri-app/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: tauri-app
        run: pnpm install --frozen-lockfile

      - name: Build Windows
        working-directory: tauri-app
        run: pnpm tauri build --target x86_64-pc-windows-msvc

      - uses: actions/upload-artifact@v4
        with:
          name: Todo_windows
          path: |
            tauri-app/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            tauri-app/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe

  release:
    needs: [build-macos, build-windows]
    if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Todo_*
          merge-multiple: true
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Build #${{ github.run_number }}
          files: artifacts/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
